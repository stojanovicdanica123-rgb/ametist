<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stranica nije pronađena — Ametist</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 34'%3E%3Crect width='30' height='34' fill='%23000'/%3E%3Cpath d='M15 3 27 9.6v14.8L15 31 3 24.4V9.6L15 3Z' fill='%23A855F7'/%3E%3Cpath d='M15 3 27 9.6 15 16.2 3 9.6 15 3Z' fill='%23E9D5FF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#000;color:#fff;font-family:'Inter',system-ui,sans-serif;line-height:1.7;display:flex;align-items:center;justify-content:center;padding:clamp(24px,6vw,72px);text-align:center;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:#07060a}
.bg b{position:absolute;display:block;border-radius:999px;filter:blur(70px)}
.bg b:nth-child(1){width:70vw;height:70vw;left:-14vw;top:-22vw;background:radial-gradient(circle,rgba(124,58,237,.55),transparent 68%)}
.bg b:nth-child(2){width:58vw;height:58vw;right:-12vw;top:4vw;background:radial-gradient(circle,rgba(168,85,247,.42),transparent 70%)}
.inner{position:relative;z-index:2;max-width:620px}
.code{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.45);margin:0 0 14px}
h1{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:clamp(32px,5vw,52px);line-height:1.1;letter-spacing:-.02em;margin:0 0 16px}
p{color:rgba(255,255,255,.62);margin:0 auto 32px;max-width:460px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:999px;background:#fff;color:#000;font-size:15px;font-weight:500;text-decoration:none;transition:background .25s ease}
.btn:hover{background:rgba(255,255,255,.86)}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><b></b><b></b></div>
<div class="inner">
  <p class="code">Greška 404</p>
  <h1>Ova stranica ne postoji.</h1>
  <p>Možda je link pogrešan ili je stranica premeštena. Vratite se na početnu i nastavite odatle.</p>
  <a class="btn" href="/">Vrati me na početnu <span style="font-size:15px;line-height:1">&#8594;</span></a>
</div>
</body>
</html>
